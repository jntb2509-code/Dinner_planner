      .sage { fill: #8DA987; }
      .terracotta { fill: #C86C45; }
      .wordmark { fill: #1B6570; }
      .wordmark-stroke { stroke: #1B6570; fill: none; }
      /* הטורקיז המקורי מגיע ליחס ניגודיות 2.6 בלבד מול רקע כהה, ואז
         טבעת היושבים כמעט נעלמת. גרסה בהירה יותר מכפילה את הניגודיות
         בלי לשנות את הגוון. */
      @media (prefers-color-scheme: dark) {
        .teal { fill: #4E96A6; }
        .teal-stroke { stroke: #4E96A6; }
        .hex { fill: #F7F4EE; stroke: #4E96A6; }
        .sage { fill: #9CBE96; }
